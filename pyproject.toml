[project]
name = "subnetting-net-lib"
authors = [{name = "monjiapawne"}]
version = "0.1"
description = "Library for interacting with subnetting.net's ASP.NET site programatically"
dependencies = ["requests>=2.32", "beautifulsoup4>=4.12"]
requires-python = ">=3.13"

[project.urls]
Homepage = "https://github.com/monjiapawne/subnetting"

[project.scripts]
subnetting = "cli.__main__:run"

[project.optional-dependencies]
test = ["pytest>=7.4.4"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "C901",
    "I",
    "N",
    "D1",
    "D2",
    "ANN",
    "S",
    "T20",
    "PIE",
    "FLY",
    "TRY",
]
ignore = [
  "ANN003",
  "ANN201",
  "ANN204",
  "ANN401",
  "D100",
  "D101",  
  "D102",
  "D103", # readd later too slow
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "N818",
  "S603",
  "TRY003",
  "TRY300",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] 
"src/cli/__main__.py" = ["T201"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subnetting", "src/cli"]
